name: Plugin Installation Test

on:
  push:
    branches: [main]
    paths:
      - '.claude-plugin/**'
      - '.github/workflows/plugin-install-test.yml'
      - 'hooks/**'
      - 'skills/**'
      - 'memory/**'
      - 'templates/mcp.json'
      - '.mcp.json'
      - 'plugin/**'
  pull_request:
    branches: [main]
    paths:
      - '.claude-plugin/**'
      - '.github/workflows/plugin-install-test.yml'
      - 'hooks/**'
      - 'skills/**'
      - 'memory/**'
      - 'templates/mcp.json'
      - '.mcp.json'
      - 'plugin/**'

jobs:
  plugin-structure:
    name: Plugin Structure Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x

      - name: Validate plugin.json
        run: |
          echo "Validating plugin.json..."
          if [ ! -f ".claude-plugin/plugin.json" ]; then
            echo "Error: .claude-plugin/plugin.json not found"
            exit 1
          fi

          node -e "
            const plugin = JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json', 'utf8'));
            const required = ['name', 'description', 'version'];
            const missing = required.filter(f => !plugin[f]);
            if (missing.length > 0) {
              console.error('Missing required fields:', missing.join(', '));
              process.exit(1);
            }
            // Verify no component path overrides (Claude Code auto-discovers)
            const badFields = ['skills', 'hooks', 'memory', 'commands'].filter(f => plugin[f]);
            if (badFields.length > 0) {
              console.error('plugin.json should NOT have component path overrides:', badFields.join(', '));
              process.exit(1);
            }
            console.log('plugin.json fields: name=%s, version=%s', plugin.name, plugin.version);
          "
          echo "plugin.json validated successfully!"

      - name: Validate marketplace.json
        run: |
          echo "Validating marketplace.json..."
          if [ ! -f ".claude-plugin/marketplace.json" ]; then
            echo "Error: .claude-plugin/marketplace.json not found"
            exit 1
          fi

          node -e "
            const mp = JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json', 'utf8'));
            const required = ['name', 'plugins'];
            const missing = required.filter(f => !mp[f]);
            if (missing.length > 0) {
              console.error('Missing required fields:', missing.join(', '));
              process.exit(1);
            }
            if (!Array.isArray(mp.plugins) || mp.plugins.length === 0) {
              console.error('plugins must be a non-empty array');
              process.exit(1);
            }
            console.log('marketplace.json validated: %d plugin(s)', mp.plugins.length);
          "
          echo "marketplace.json validated successfully!"

      - name: Validate plugin/ file limits (AC-2, #1265)
        run: |
          echo "Checking plugin/ against the directory review limits..."

          file_count=$(find plugin -type f | wc -l | tr -d ' ')
          echo "File count: $file_count (limit: 512)"
          if [ "$file_count" -gt 512 ]; then
            echo "Error: plugin/ has $file_count files, limit is 512"
            exit 1
          fi

          echo "Checking for non-image files over 256 KiB..."
          big_files=$(find plugin -type f -size +256k \
            ! -iname '*.png' ! -iname '*.jpg' ! -iname '*.jpeg' \
            ! -iname '*.gif' ! -iname '*.svg' ! -iname '*.webp' || true)
          if [ -n "$big_files" ]; then
            echo "Error: non-image files over 256 KiB:"
            echo "$big_files"
            exit 1
          fi

          echo "Checking for symlinks..."
          symlinks=$(find plugin -type l || true)
          if [ -n "$symlinks" ]; then
            echo "Error: plugin/ contains symlinks (loader rejects a symlink leading outside the plugin):"
            echo "$symlinks"
            exit 1
          fi

          echo "Checking for .DS_Store / Thumbs.db..."
          junk=$(find plugin -type f \( -name '.DS_Store' -o -name 'Thumbs.db' \) || true)
          if [ -n "$junk" ]; then
            echo "Error: plugin/ contains OS junk files:"
            echo "$junk"
            exit 1
          fi

          echo "plugin/ passes file limits: $file_count files, no oversized non-image files, no symlinks, no OS junk."

      - name: Validate MCP server config template
        run: |
          echo "Validating MCP server config template..."
          if [ ! -f "templates/mcp.json" ]; then
            echo "Error: templates/mcp.json not found — plugin users won't get MCP tools"
            exit 1
          fi

          node -e "
            const mcp = JSON.parse(require('fs').readFileSync('templates/mcp.json', 'utf8'));
            // Plugin .mcp.json uses flat format (server name as top-level key)
            const server = mcp.sequant;
            if (!server) {
              console.error('Missing sequant server entry');
              process.exit(1);
            }
            // #1089: the inline node -e launcher (the #1084 shape), never a bare
            // npx run from the project dir, where a local sequant shadows the pin.
            const args = server.args || [];
            if (server.command !== 'node' || args.length !== 3 || args[0] !== '-e') {
              console.error('MCP server must be the inline launcher (node -e <source> <spec>), got:', server.command, args.length, 'args');
              process.exit(1);
            }
            if (typeof args[1] !== 'string' || !args[1].includes('mcp-launch')) {
              console.error('MCP server args[1] must be the inline launcher source');
              process.exit(1);
            }
            if (typeof args[2] !== 'string' || !args[2].startsWith('sequant@')) {
              console.error('MCP server args[2] must be the sequant package spec, got:', args[2]);
              process.exit(1);
            }
            if (server.cwd) {
              console.error('MCP server must NOT have hardcoded cwd');
              process.exit(1);
            }
            console.log('MCP config: command=%s launcher=%d chars spec=%s', server.command, args[1].length, args[2]);
          "
          echo "MCP server config validated!"

      - name: Install dependencies
        run: npm ci

      - name: Build marketplace package
        run: npm run prepare:marketplace

      - name: Check version sync (including dist output)
        run: |
          echo "Checking version sync across all files..."
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const plugin = JSON.parse(fs.readFileSync('.claude-plugin/plugin.json', 'utf8'));
            const mp = JSON.parse(fs.readFileSync('.claude-plugin/marketplace.json', 'utf8'));

            const versions = {
              'package.json': pkg.version,
              'plugin.json': plugin.version,
              'marketplace.json': mp.plugins[0]?.version
            };

            // Also check dist output if it exists (built by prepare:marketplace)
            const distPluginPath = 'dist/marketplace/external_plugins/sequant/.claude-plugin/plugin.json';
            if (fs.existsSync(distPluginPath)) {
              const distPlugin = JSON.parse(fs.readFileSync(distPluginPath, 'utf8'));
              versions['dist/plugin.json'] = distPlugin.version;
            }

            console.log('Versions:', JSON.stringify(versions, null, 2));

            const unique = new Set(Object.values(versions).filter(Boolean));
            if (unique.size > 1) {
              console.error('Version mismatch detected!');
              process.exit(1);
            }
            console.log('All versions in sync: %s', pkg.version);
          "

      - name: Verify skills are discoverable
        run: |
          echo "Checking skills directory..."
          skill_count=0
          missing_skills=""

          for skill_dir in skills/*/; do
            # Skip shared-resource directories (not skills): _shared/ and references/
            if [[ "$skill_dir" == *"_shared"* || "$skill_dir" == *"/references/"* ]]; then
              continue
            fi

            skill_name=$(basename "$skill_dir")

            if [ -f "${skill_dir}SKILL.md" ]; then
              # Verify SKILL.md is non-empty
              if [ -s "${skill_dir}SKILL.md" ]; then
                skill_count=$((skill_count + 1))
              else
                missing_skills="${missing_skills}\n  - ${skill_name}/SKILL.md (empty)"
              fi
            else
              missing_skills="${missing_skills}\n  - ${skill_name}/SKILL.md (missing)"
            fi
          done

          echo "Found ${skill_count} valid skills"

          if [ -n "$missing_skills" ]; then
            echo "Problems found:${missing_skills}"
            exit 1
          fi

          if [ "$skill_count" -eq 0 ]; then
            echo "Error: No skills found in skills/ directory"
            exit 1
          fi

          echo "All skills have valid SKILL.md files!"

      - name: Install Claude Code CLI
        run: |
          echo "Installing Claude Code CLI..."
          npm install -g @anthropic-ai/claude-code
          claude --version || echo "Claude CLI installed but --version not supported"

      - name: Validate plugin with Claude CLI (AC-7, #1265)
        run: |
          echo "Running claude plugin validate --strict on plugin/ and the marketplace..."
          claude plugin validate --strict ./plugin
          claude plugin validate --strict .claude-plugin/marketplace.json

      - name: Test marketplace add (local)
        run: |
          echo "Testing claude plugin marketplace add..."
          claude plugin marketplace add ./ --scope local

      - name: Test plugin loads with --plugin-dir
        run: |
          echo "Testing claude --plugin-dir . loads plugin..."
          # Verify plugin loads: skills, hooks, and MCP config are discovered
          output=$(claude --plugin-dir . --print "list available skills" 2>&1 || true)
          if echo "$output" | grep -qi "sequant\|assess\|spec\|exec"; then
            echo "Plugin loaded successfully — skills discovered"
          else
            echo "Warning: Could not verify skill discovery (may need interactive session)"
            echo "Output: $output"
            # Non-blocking — validate and install tests are the primary gates
          fi

      - name: Test plugin install
        run: |
          echo "Testing claude plugin install sequant@sequant..."
          claude plugin install sequant@sequant

      - name: Verify install creates no node_modules in the plugin cache (AC-1, #1265)
        run: |
          echo "Installing into an isolated profile and plugin cache..."
          # Isolated so this never touches the runner's real Claude config or
          # a prior step's cache, and so the assertion below checks exactly
          # what a fresh install writes.
          export CLAUDE_CONFIG_DIR
          CLAUDE_CONFIG_DIR=$(mktemp -d)
          export CLAUDE_CODE_PLUGIN_CACHE_DIR
          CLAUDE_CODE_PLUGIN_CACHE_DIR=$(mktemp -d)
          echo "CLAUDE_CONFIG_DIR=$CLAUDE_CONFIG_DIR"
          echo "CLAUDE_CODE_PLUGIN_CACHE_DIR=$CLAUDE_CODE_PLUGIN_CACHE_DIR"

          claude plugin marketplace add ./
          claude plugin install sequant@sequant

          echo "Searching for node_modules under the plugin cache..."
          hits=$(find "$CLAUDE_CODE_PLUGIN_CACHE_DIR" "$CLAUDE_CONFIG_DIR" \
            -type d -name node_modules -path '*/sequant/sequant/*' 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "Error: install created node_modules under the plugin cache (plugin/ must ship with no package.json/lockfile):"
            echo "$hits"
            exit 1
          fi
          echo "No node_modules found under the plugin cache — install stayed slim."

      - name: Verify README install commands work verbatim (#1263)
        run: |
          echo "Extracting install commands from README.md's plugin section..."
          # Pull the fenced code block that follows the "Inside Claude Code
          # (plugin)" heading — this is the block users copy-paste, so it is
          # the one that must actually work.
          awk '
            /\*\*Inside Claude Code \(plugin\)\*\*/ { found=1; next }
            found && /^```$/ { if (infence) exit; infence=1; next }
            found && infence { print }
          ' README.md > /tmp/readme-install-lines.txt

          echo "Extracted block:"
          cat /tmp/readme-install-lines.txt

          install_lines=$(grep '^/plugin ' /tmp/readme-install-lines.txt || true)
          if [ -z "$install_lines" ]; then
            echo "Error: no '/plugin ...' lines found in README.md's plugin section"
            exit 1
          fi

          # Isolated profile so this never touches the runner's real Claude
          # config, and so a stale marketplace/install from an earlier step
          # in this job can't mask a broken README command.
          export CLAUDE_CONFIG_DIR
          CLAUDE_CONFIG_DIR=$(mktemp -d)
          echo "Using isolated CLAUDE_CONFIG_DIR: $CLAUDE_CONFIG_DIR"

          while IFS= read -r line; do
            # Translate the slash-command form documented in README.md to the
            # equivalent shell CLI form (CI has no interactive session).
            cmd="${line/\/plugin/claude plugin}"
            if [[ "$cmd" == "claude plugin marketplace add "* ]]; then
              # Point the marketplace add at this checkout instead of GitHub:
              # marketplace.json's own "name" field ("sequant") is what the
              # later install line resolves against, so this keeps the test
              # hermetic while still catching a documented install line that
              # names the wrong marketplace (the #1263 bug).
              cmd="claude plugin marketplace add ./"
            fi
            echo "Running: $cmd"
            eval "$cmd"
          done <<< "$install_lines"

          echo "README install commands succeeded verbatim"

  hooks-test:
    name: Hooks Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Syntax check hook scripts
        run: |
          echo "Running bash syntax check on hooks..."
          bash -n hooks/pre-tool.sh
          echo "pre-tool.sh: syntax OK"

          bash -n hooks/post-tool.sh
          echo "post-tool.sh: syntax OK"

      - name: Validate hooks.json structure
        run: |
          echo "Validating hooks.json..."
          node -e "
            const hooks = JSON.parse(require('fs').readFileSync('hooks/hooks.json', 'utf8'));
            if (!hooks.hooks) {
              console.error('Missing hooks key');
              process.exit(1);
            }

            const hookTypes = Object.keys(hooks.hooks);
            console.log('Hook types:', hookTypes.join(', '));

            // Verify each hook references a valid script
            for (const [type, matchers] of Object.entries(hooks.hooks)) {
              for (const matcher of matchers) {
                for (const hook of matcher.hooks) {
                  if (hook.type === 'command') {
                    // Extract script path (remove variable prefix)
                    const scriptPath = hook.command
                      .replace(/\"\\\$\{CLAUDE_PLUGIN_ROOT\}\//, '')
                      .replace(/\"$/, '');
                    const fs = require('fs');
                    if (!fs.existsSync(scriptPath)) {
                      console.error('Referenced script not found:', scriptPath);
                      process.exit(1);
                    }
                    console.log('  %s → %s (exists)', type, scriptPath);
                  }
                }
              }
            }
            console.log('hooks.json validated!');
          "

      - name: Check hook scripts use portable temp paths
        run: |
          echo "Checking for portable temp path usage..."
          for script in hooks/pre-tool.sh hooks/post-tool.sh; do
            bare_count=$(grep -c '="/tmp/' "$script" 2>/dev/null || true)
            portable_count=$(grep -c 'TMPDIR:-/tmp' "$script" 2>/dev/null || true)
            echo "$script: $portable_count portable refs, $bare_count bare /tmp refs"
            if [ "$bare_count" -gt 0 ]; then
              echo "Warning: $script has $bare_count bare /tmp/ references — should use \${TMPDIR:-/tmp}"
            fi
          done

      - name: Smoke test pre-tool hook
        run: |
          echo "Smoke testing pre-tool.sh with mock input..."

          # Mock Bash tool input
          mock_input='{"tool_name":"Bash","tool_input":{"command":"echo hello"}}'

          # Run hook with mock input — should exit 0 (allow)
          echo "$mock_input" | bash hooks/pre-tool.sh
          exit_code=$?

          if [ "$exit_code" -eq 0 ]; then
            echo "pre-tool.sh: allowed (exit 0) — OK"
          elif [ "$exit_code" -eq 2 ]; then
            echo "pre-tool.sh: blocked (exit 2) — unexpected for safe command"
            exit 1
          else
            echo "pre-tool.sh: exit code $exit_code"
            exit 1
          fi

      - name: Smoke test post-tool hook
        run: |
          echo "Smoke testing post-tool.sh with mock input..."

          # Mock Bash tool output
          mock_input='{"tool_name":"Bash","tool_input":{"command":"echo hello"},"tool_response":"hello"}'

          # Run hook — should exit 0
          echo "$mock_input" | bash hooks/post-tool.sh
          exit_code=$?

          if [ "$exit_code" -eq 0 ]; then
            echo "post-tool.sh: exit 0 — OK"
          else
            echo "post-tool.sh: exit code $exit_code — unexpected"
            exit 1
          fi

      - name: Test security guardrail (blocked command)
        run: |
          echo "Testing that pre-tool.sh blocks dangerous commands..."

          # Mock a dangerous command that should be blocked
          mock_input='{"tool_name":"Bash","tool_input":{"command":"rm -rf /"}}'

          # Use || true to capture exit code — pre-tool.sh exits 2 to block,
          # which would fail under bash -e before we can check it
          exit_code=0
          echo "$mock_input" | bash hooks/pre-tool.sh || exit_code=$?

          if [ "$exit_code" -eq 2 ]; then
            echo "pre-tool.sh: correctly blocked dangerous command (exit 2)"
          elif [ "$exit_code" -eq 0 ]; then
            echo "Warning: pre-tool.sh allowed dangerous command — check guardrails"
            # Not failing the build — guardrail coverage varies
          else
            echo "pre-tool.sh: exit code $exit_code"
          fi

  setup-test:
    name: Setup Directory Creation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test directory creation
        run: |
          echo "Testing setup directory creation logic..."

          # Create the directories that /sequant:setup would create
          mkdir -p .sequant
          mkdir -p ../worktrees/feature

          # Verify they exist
          if [ -d ".sequant" ]; then
            echo ".sequant/ directory: created"
          else
            echo "Error: .sequant/ directory not created"
            exit 1
          fi

          if [ -d "../worktrees/feature" ]; then
            echo "../worktrees/feature/ directory: created"
          else
            echo "Error: ../worktrees/feature/ directory not created"
            exit 1
          fi

          echo "Setup directories created successfully!"

      - name: Verify git prerequisites
        run: |
          echo "Checking git prerequisites..."
          git --version
          echo "Git is available"

      - name: Test constitution template exists
        run: |
          echo "Checking for constitution template..."
          if [ -f "templates/constitution.md" ]; then
            echo "Constitution template found"
            # Verify it contains expected placeholder
            if grep -q "{{PROJECT_NAME}}" templates/constitution.md 2>/dev/null; then
              echo "Template contains PROJECT_NAME placeholder"
            else
              echo "Note: Template may not use placeholder format"
            fi
          else
            echo "Note: templates/constitution.md not found — setup may use inline content"
          fi

  upgrade-test:
    name: In-place Upgrade (AC-5, #1265)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Use Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x

      - name: Install Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version || echo "Claude CLI installed but --version not supported"

      - name: Install 2.18.0 (repo-root plugin), then upgrade in place
        env:
          # The ref Claude Code clones for the upgraded marketplace: this PR's
          # head branch, or the pushed branch on a push event.
          UPGRADE_REF: ${{ github.head_ref || github.ref_name }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork || false }}
        run: |
          set -e
          # Real-user path: a GitHub-sourced marketplace. Claude Code clones it
          # and COPIES the plugin into the cache, running `npm ci` when the
          # plugin root has package.json + a lockfile. A local-directory
          # marketplace would load the plugin in place with no cache copy and
          # no install, so it can't show the #1265 fix. `owner/repo#ref` pins
          # the clone to a tag or branch.
          if [[ "$IS_FORK" == "true" ]]; then
            echo "Fork PR: its branch isn't on sequant-io/sequant; skipping the upgrade test."
            exit 0
          fi

          export CLAUDE_CONFIG_DIR CLAUDE_CODE_PLUGIN_CACHE_DIR
          CLAUDE_CONFIG_DIR=$(mktemp -d)
          CLAUDE_CODE_PLUGIN_CACHE_DIR="$CLAUDE_CONFIG_DIR/plugins"
          MKT="$CLAUDE_CODE_PLUGIN_CACHE_DIR/marketplaces/sequant"

          echo "Installing sequant@sequant from the v2.18.0 tag (repo-root layout)..."
          claude plugin marketplace add "sequant-io/sequant#v2.18.0"
          claude plugin install sequant@sequant

          # Baseline: the old layout really does pull node_modules, so the
          # absence check below can tell the layouts apart.
          # Read the real install path rather than assuming the cache layout.
          install_path() {
            jq -r '.plugins["sequant@sequant"][0].installPath // empty' \
              "$CLAUDE_CODE_PLUGIN_CACHE_DIR/installed_plugins.json" 2>/dev/null || true
          }
          diagnose() {
            echo "--- installed_plugins.json:"; cat "$CLAUDE_CODE_PLUGIN_CACHE_DIR/installed_plugins.json" 2>/dev/null || echo "(missing)"
            echo "--- plugin dirs:"; find "$CLAUDE_CONFIG_DIR" "$HOME/.claude/plugins" -maxdepth 6 -type d -path '*sequant*' 2>/dev/null | head -20
          }
          OLD=$(install_path)
          if [[ -z "$OLD" || ! -e "$OLD/package.json" || ! -d "$OLD/node_modules" ]]; then
            echo "Error: baseline 2.18.0 install at '${OLD}' has no package.json/node_modules; the test can't distinguish layouts"
            ls -a "$OLD" 2>/dev/null | head -40 || true
            diagnose
            exit 1
          fi
          echo "Baseline OK: $OLD holds $(du -sh "$OLD" | cut -f1) including node_modules"

          echo "Repointing the marketplace at $UPGRADE_REF (simulates the remote moving forward)..."
          jq --arg r "$UPGRADE_REF" '.extraKnownMarketplaces.sequant.source.ref=$r' "$CLAUDE_CONFIG_DIR/settings.json" > "$RUNNER_TEMP/s.json"
          mv "$RUNNER_TEMP/s.json" "$CLAUDE_CONFIG_DIR/settings.json"
          jq --arg r "$UPGRADE_REF" '.sequant.source.ref=$r' "$CLAUDE_CODE_PLUGIN_CACHE_DIR/known_marketplaces.json" > "$RUNNER_TEMP/k.json"
          mv "$RUNNER_TEMP/k.json" "$CLAUDE_CODE_PLUGIN_CACHE_DIR/known_marketplaces.json"
          claude plugin marketplace update sequant
          [[ "$(jq -r '.plugins[0].source' "$MKT/.claude-plugin/marketplace.json")" == "./plugin" ]] || {
            echo "Error: the updated marketplace clone doesn't list source ./plugin"
            exit 1
          }

          # Users only receive a new copy when the version changes; this branch
          # still says the released version, so stamp a test version into the
          # cloned marketplace (as a release bump would) before updating.
          V="$(jq -r .version "$MKT/plugin/.claude-plugin/plugin.json")-upgradetest.${GITHUB_RUN_ID:-0}"
          jq --arg v "$V" '.version=$v' "$MKT/plugin/.claude-plugin/plugin.json" > "$RUNNER_TEMP/p.json"
          mv "$RUNNER_TEMP/p.json" "$MKT/plugin/.claude-plugin/plugin.json"
          jq --arg v "$V" '.plugins[0].version=$v' "$MKT/.claude-plugin/marketplace.json" > "$RUNNER_TEMP/m.json"
          mv "$RUNNER_TEMP/m.json" "$MKT/.claude-plugin/marketplace.json"

          # The MCP pin names the package version this branch will publish. On a
          # release PR that version isn't on npm yet, so `npx -y sequant@<pin>`
          # can't start. Point the cloned config at the latest published version
          # instead: the check below is about the launcher file and the
          # connection, not the unpublished package.
          PIN=$(jq -r '.mcpServers.sequant.args[-1]' "$MKT/plugin/.mcp.json")
          if ! npm view "$PIN" version >/dev/null 2>&1; then
            LATEST="sequant@$(npm view sequant version)"
            echo "$PIN isn't published yet (release PR); using $LATEST for the MCP connection check"
            jq --arg p "$LATEST" '.mcpServers.sequant.args[-1]=$p' "$MKT/plugin/.mcp.json" > "$RUNNER_TEMP/mcp.json"
            mv "$RUNNER_TEMP/mcp.json" "$MKT/plugin/.mcp.json"
          fi

          echo "Updating sequant@sequant to $V..."
          claude plugin update sequant@sequant

          NEW=$(install_path)
          if [[ -z "$NEW" || "$NEW" == "$OLD" || ! -d "$NEW" ]]; then
            echo "Error: the update did not install a new copy (install path '${NEW}')"
            diagnose
            exit 1
          fi
          for f in package.json package-lock.json node_modules; do
            if [[ -e "$NEW/$f" ]]; then
              echo "Error: upgraded install still has $f"
              exit 1
            fi
          done
          echo "Upgraded install: $(du -sh "$NEW" | cut -f1), no package.json/node_modules"

          echo "Verifying the install id survived the move to plugin/ and still loads..."
          DETAILS=$(claude plugin details sequant@sequant)
          echo "$DETAILS"
          echo "$DETAILS" | grep -q "sequant $V" || {
            echo "Error: sequant@sequant is not loaded at $V after the upgrade"
            exit 1
          }
          for skill in assess spec exec qa; do
            if [[ ! -s "$NEW/skills/$skill/SKILL.md" ]]; then
              echo "Error: $skill/SKILL.md missing or empty after the upgrade"
              exit 1
            fi
          done
          [[ -s "$NEW/.mcp.json" && -s "$NEW/hooks/hooks.json" ]] || { echo "Error: .mcp.json or hooks.json missing after the upgrade"; exit 1; }
          echo "Skills, hooks and MCP config present after upgrade."

          echo "Verifying the MCP server still connects after the upgrade..."
          mcp_status=$(claude mcp list 2>&1)
          echo "$mcp_status"
          echo "$mcp_status" | grep -E "^plugin:sequant:sequant:.*✔ Connected" || {
            echo "Error: plugin:sequant:sequant MCP server is not connected after the upgrade"
            exit 1
          }

