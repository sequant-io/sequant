name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The merge queue builds each queued PR on a temporary branch off the latest
  # `main` and waits for the required contexts (`test`, `canary`) to report on
  # this event. Without this trigger a queued PR never gets its checks (#1350).
  merge_group:

jobs:
  # The check-run context required by the `main` ruleset (#1093,
  # scripts/ruleset-main.sh). Two properties of this job are load-bearing and
  # must not be changed casually:
  #
  #   1. The job id is `test`, so the context GitHub reports is exactly `test`
  #      — the context named in the ruleset payload.
  #   2. It carries NO `strategy.matrix`. A matrix — even a single-entry one,
  #      which is what this job had until #1093 — suffixes the context
  #      (`build (22.x)`). A required context that never reports stalls the
  #      merge queue until its check-response timeout and then ejects the PR,
  #      so bumping `node-version` under a matrix would brick merging silently.
  #
  # `canary` is held to the same two rules, and both jobs must keep running on
  # `merge_group` (see the `on:` block above).
  #
  # Renaming this job, or adding a matrix to it, requires updating
  # REQUIRED_CHECK_CONTEXT in scripts/ruleset-main.sh and re-applying the
  # ruleset by hand.
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Test CLI
        run: |
          npm run dev -- --help
          npm run dev -- status 2>/dev/null || true

  # Downstream canary (#1098): a fixture project on the previous minor release,
  # customized like a real one, driven by this PR's build. Needs the npm
  # registry, so it is its own job and NOT part of `test` (the required check).
  canary:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Downstream canary
        run: npm run test:canary

  # Real sub-floor Node coverage for the runtime preflight guard (#734).
  # CI otherwise runs Node 22 only, so the guard's fail path — the scenario the
  # feature exists for — would never execute on the old Node it targets. We
  # build on Node 22 (reliable), then switch the runtime to a below-floor Node
  # and run the prebuilt CLI: it must print the guard message and exit non-zero
  # BEFORE reaching commander / the agent SDK. This also proves the import-time
  # ordering fix (bin/preflight.ts evaluates first) on a genuinely old runtime.
  node-floor-guard:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22.x (build)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Switch to below-floor Node 20.x (keep node_modules + dist)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.x

      - name: Guard fails fast on below-floor Node
        run: |
          set +e
          echo "Running on $(node --version)"
          out=$(node dist/bin/cli.js --version 2>&1)
          code=$?
          set -e
          echo "----- CLI output -----"
          echo "$out"
          echo "----- exit code: $code -----"
          if [ "$code" -eq 0 ]; then
            echo "FAIL: expected non-zero exit on below-floor Node, got 0"
            exit 1
          fi
          if ! echo "$out" | grep -q "requires Node.js"; then
            echo "FAIL: guard message not printed"
            exit 1
          fi
          echo "PASS: preflight guard fired before command logic on Node 20"

  validate-skills:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate all skills
        run: |
          echo "Validating all skills with skills-ref..."
          for skill in templates/skills/*/; do
            # Skip shared-resource directories (not skills): _shared/ and references/
            if [[ "$skill" == *"_shared"* || "$skill" == *"/references/"* ]]; then
              echo "Skipping ${skill} (shared resources)"
              continue
            fi
            echo "Validating ${skill}..."
            npx skills-ref validate "$skill"
          done
          echo "All skills validated successfully!"

      - name: Lint skill calls
        run: npm run lint:skill-calls

      # Claude Code substitutes $0/$1 in skill text, fenced code included (#1289).
      - name: Lint skill argument substitution
        run: npm run lint:skill-argument-substitution

      # Asserts /qa's declared verdict floors are reachable from its §7
      # algorithm. §2h's gate was prose-only from the day it shipped (#834).
      - name: Lint skill gates
        run: npm run lint:skill-gates

      # Asserts the constitution DoD table matches §7 step-4 gates (#943).
      - name: Check constitution DoD drift
        run: npm run lint:constitution-dod

      - name: Check skill sync
        run: npm run lint:skill-sync

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # `tsconfig.json` covers only the src/+bin/ code that `npm run build`
      # emits, so nothing under `scripts/` was typechecked by any gate — the
      # CLIs that /qa and /spec shell out to were unguarded. Separate project
      # because these must never be emitted to dist/.
      - name: Type check scripts
        run: npm run typecheck:scripts

  validate-plugin:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x

      - name: Validate plugin.json structure
        run: |
          echo "Validating plugin.json..."

          # Check plugin.json exists
          if [ ! -f "plugin/.claude-plugin/plugin.json" ]; then
            echo "Error: plugin/.claude-plugin/plugin.json not found"
            exit 1
          fi

          # Validate JSON syntax
          if ! node -e "JSON.parse(require('fs').readFileSync('plugin/.claude-plugin/plugin.json', 'utf8'))"; then
            echo "Error: plugin.json is not valid JSON"
            exit 1
          fi

          # Check required fields
          node -e "
            const plugin = JSON.parse(require('fs').readFileSync('plugin/.claude-plugin/plugin.json', 'utf8'));
            const required = ['name', 'description'];
            const missing = required.filter(f => !plugin[f]);
            if (missing.length > 0) {
              console.error('Missing required fields:', missing.join(', '));
              process.exit(1);
            }
            console.log('Required fields present: name, description');
          "

          echo "plugin.json validated successfully!"

      - name: Check version sync
        run: |
          echo "Checking version sync between package.json and plugin.json..."

          PKG_VERSION=$(node -p "require('./package.json').version")
          PLUGIN_VERSION=$(node -p "require('./plugin/.claude-plugin/plugin.json').version")

          echo "package.json version: $PKG_VERSION"
          echo "plugin.json version: $PLUGIN_VERSION"

          if [ "$PKG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "Error: Version mismatch!"
            echo "package.json: $PKG_VERSION"
            echo "plugin.json: $PLUGIN_VERSION"
            echo ""
            echo "Run the following to sync:"
            echo "  node -e \"const p=require('./plugin/.claude-plugin/plugin.json');p.version='$PKG_VERSION';require('fs').writeFileSync('./plugin/.claude-plugin/plugin.json',JSON.stringify(p,null,2)+'\\n')\""
            exit 1
          fi

          echo "Versions are in sync!"

      - name: Validate marketplace.json structure
        run: |
          echo "Validating marketplace.json..."

          # Check marketplace.json exists
          if [ ! -f ".claude-plugin/marketplace.json" ]; then
            echo "Error: .claude-plugin/marketplace.json not found"
            exit 1
          fi

          # Validate JSON syntax
          if ! node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json', 'utf8'))"; then
            echo "Error: marketplace.json is not valid JSON"
            exit 1
          fi

          # Check required fields
          node -e "
            const mp = JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json', 'utf8'));
            const required = ['name', 'plugins'];
            const missing = required.filter(f => !mp[f]);
            if (missing.length > 0) {
              console.error('Missing required fields:', missing.join(', '));
              process.exit(1);
            }
            if (!Array.isArray(mp.plugins) || mp.plugins.length === 0) {
              console.error('plugins must be a non-empty array');
              process.exit(1);
            }
            console.log('Required fields present: name, plugins');
          "

          echo "marketplace.json validated successfully!"

      - name: Verify version sync check catches mismatches (negative test)
        run: |
          echo "Testing that version sync check catches mismatches..."

          # Backup original plugin.json
          cp plugin/.claude-plugin/plugin.json plugin/.claude-plugin/plugin.json.bak

          # Create a version mismatch
          node -e "
            const fs = require('fs');
            const plugin = JSON.parse(fs.readFileSync('plugin/.claude-plugin/plugin.json', 'utf8'));
            plugin.version = '0.0.0-test-mismatch';
            fs.writeFileSync('plugin/.claude-plugin/plugin.json', JSON.stringify(plugin, null, 2) + '\n');
          "

          # Run the sync check - it SHOULD fail
          PKG_VERSION=$(node -p "require('./package.json').version")
          PLUGIN_VERSION=$(node -p "require('./plugin/.claude-plugin/plugin.json').version")

          if [ "$PKG_VERSION" = "$PLUGIN_VERSION" ]; then
            echo "ERROR: Versions should not match in this test!"
            mv plugin/.claude-plugin/plugin.json.bak plugin/.claude-plugin/plugin.json
            exit 1
          fi

          echo "✓ Version mismatch correctly detected (package: $PKG_VERSION, plugin: $PLUGIN_VERSION)"

          # Restore original plugin.json
          mv plugin/.claude-plugin/plugin.json.bak plugin/.claude-plugin/plugin.json
          echo "✓ Negative test passed - version sync check works correctly"

  # Phase A (advisory, measured) rollout of the test-tautology detector in CI
  # (#940). Always exits 0 — findings are annotations + a job-summary line,
  # not a merge gate. A dated follow-up on #940 decides whether Phase B
  # (enforcement) ships, based on the FP rate accumulated from
  # TAUTOLOGY_SUMMARY lines across real PRs.
  tautology-advisory:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      # fetch-depth: 0 (full history) — the default fetch-depth: 1 checks out
      # only the PR merge commit with no parent links, so `origin/<base>...HEAD`
      # has no discoverable merge-base and the diff fails with "no merge base"
      # (confirmed live on this PR's own first CI run). Full history also
      # populates refs/remotes/origin/* for every branch, so `origin/<base>`
      # resolves without a separate fetch step.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Use Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tautology detector (advisory)
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          npx tsx scripts/qa/tautology-detector-cli.ts \
            --base "origin/$BASE_REF" \
            --advisory \
            --github
